name: Wroughtmark Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core-and-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Test wroughtmark-core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test wroughtmark-desktop
        run: cargo test --manifest-path desktop-win-linux/Cargo.toml
      - name: Build and test macOS desktop app & Swift FFI
        if: runner.os == 'macOS'
        run: |
          cargo build --manifest-path core/Cargo.toml
          swift test --package-path apple
          swift build --package-path apple --product WroughtmarkApp

  web-sdk-and-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Build wroughtmark CLI
        run: cargo build --manifest-path core/Cargo.toml --bin wroughtmark
      - name: Run WebCrypto & plugin suites
        run: bash scripts/verify.sh
