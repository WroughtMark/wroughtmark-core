name: Release Open Core Desktop Apps & Plugins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Build macOS MenuBarExtra app (.dmg & .tar.gz) and CLI/desktop binaries
        env:
          CI: "true"
        run: |
          bash scripts/package.sh
          mkdir -p upload
          cp dist/Wroughtmark-macOS-*.dmg dist/Wroughtmark-macOS-*.tar.gz upload/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: upload/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build Linux x86_64 release bundle
        run: |
          cargo build --release --manifest-path core/Cargo.toml --bin wroughtmark
          cargo build --release --manifest-path desktop-win-linux/Cargo.toml
          mkdir -p staging upload
          cp core/target/release/wroughtmark desktop-win-linux/target/release/wroughtmark-desktop staging/
          tar -czf upload/wroughtmark-linux-x86_64.tar.gz -C staging wroughtmark wroughtmark-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: upload/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows x86_64 release bundle
        shell: pwsh
        run: |
          cargo build --release --manifest-path core/Cargo.toml --bin wroughtmark
          cargo build --release --manifest-path desktop-win-linux/Cargo.toml
          New-Item -ItemType Directory -Force -Path staging, upload | Out-Null
          Copy-Item core/target/release/wroughtmark.exe staging/
          Copy-Item desktop-win-linux/target/release/wroughtmark-desktop.exe staging/
          Compress-Archive -Path staging/* -DestinationPath upload/wroughtmark-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: upload/*

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build all open-core plugins & MCP bundle
        run: |
          mkdir -p plugins upload
          for plugin in browser-extension office-addin google-workspace-addon skills/wroughtmark-provenance integrations/vscode integrations/obsidian integrations/figma integrations/adobe-uxp; do
            name="$(basename "$plugin")"
            bun run --cwd "$plugin" build >/dev/null
            mkdir -p "plugins/$name"
            cp -R "$plugin/dist" "plugins/$name/"
            for meta in manifest.json manifest.xml appsscript.json SKILL.md package.json README.md; do
              [ -f "$plugin/$meta" ] && cp "$plugin/$meta" "plugins/$name/"
            done
          done
          mkdir -p plugins/blender plugins/reaper
          cp integrations/blender/wroughtmark_blender.py plugins/blender/
          cp integrations/reaper/wroughtmark_reaper.py plugins/reaper/
          (cd plugins && zip -q -r ../upload/wroughtmark-plugins-bundle.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-artifacts
          path: upload/*

  release:
    needs: [build-macos, build-linux, build-windows, build-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums & release notes
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh
          {
            cat <<'EOF'
          ## Open-Core Desktop Apps, CLI & Plugins (MIT License)

          **Privacy Invariant:** Zero raw documents, audio stems, layered art, timelines, or source code ever leave your device.

          ### Direct Downloads & Verification
          | File | SHA-256 Digest | VirusTotal Report |
          |---|---|---|
          EOF
            while read -r hash file; do
              [ "$file" = "SHA256SUMS.txt" ] && continue
              printf '| [`%s`](https://github.com/WroughtMark/wroughtmark-core/releases/download/%s/%s) | `%s` | [VirusTotal Report](https://www.virustotal.com/gui/file/%s) |\n' \
                "$file" "${GITHUB_REF_NAME}" "$file" "$hash" "$hash"
            done < SHA256SUMS.txt
            cat <<'EOF'

          ### Verify Checksums
          ```bash
          # macOS / Linux
          shasum -a 256 -c SHA256SUMS.txt
          ```

          ```powershell
          # Windows PowerShell
          Get-FileHash .\wroughtmark-windows-x86_64.zip -Algorithm SHA256
          ```

          > macOS builds signed locally with Developer ID (`HL4S9RXPF6`) are notarized by Apple Notary Service; Windows and Linux CI builds ship with SHA-256 digests and VirusTotal links above (if Windows SmartScreen prompts, verify the hash and choose **More info -> Run anyway**).
          EOF
          } > /tmp/release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wroughtmark Core ${{ github.ref_name }}"
          generate_release_notes: true
          body_path: /tmp/release-body.md
          files: release-assets/*
