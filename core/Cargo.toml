[package]
name = "wroughtmark-core"
version = "0.1.0"
edition = "2021"
description = "Shared cryptographic core and process-chain verifier for Wroughtmark"
license = "MIT"

[lib]
name = "wroughtmark_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
blake3 = "1.5"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
